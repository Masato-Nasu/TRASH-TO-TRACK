name: Release TRASH TO TRACK v0.6.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v0.6.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build installable APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TRASH-TO-TRACK-v0.6.0.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 TRASH-TO-TRACK-v0.6.0.apk --clobber
          else
            gh release create v0.6.0 TRASH-TO-TRACK-v0.6.0.apk \
              --title "TRASH TO TRACK v0.6.0" \
              --notes "Android APK release for TRASH TO TRACK v0.6.0. Delete unwanted data, convert deleted bytes into TRACK credit, and generate music from the resulting ESSENCE. 25 MB deleted = 1 TRACK."
          fi
